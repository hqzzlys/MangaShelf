name: Signed Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MANGASHELF_STORE_PASSWORD: ${{ secrets.MANGASHELF_STORE_PASSWORD }}
      MANGASHELF_KEY_ALIAS: ${{ secrets.MANGASHELF_KEY_ALIAS }}
      MANGASHELF_KEY_PASSWORD: ${{ secrets.MANGASHELF_KEY_PASSWORD }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MANGASHELF_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$MANGASHELF_STORE_PASSWORD"
          test -n "$MANGASHELF_KEY_ALIAS"
          test -n "$MANGASHELF_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mangashelf-release.jks"
          echo "MANGASHELF_KEYSTORE_PATH=$RUNNER_TEMP/mangashelf-release.jks" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed APK
        run: ./gradlew clean testDebugUnitTest lintDebug assembleRelease --stacktrace --no-daemon

      - name: Prepare release files
        shell: bash
        run: |
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk"
          cp "$source_apk" "MangaShelf-${GITHUB_REF_NAME}.apk"
          sha256sum "MangaShelf-${GITHUB_REF_NAME}.apk" > "MangaShelf-${GITHUB_REF_NAME}.sha256"

      - name: Attest release APK
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            MangaShelf-${{ github.ref_name }}.apk
            MangaShelf-${{ github.ref_name }}.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "MangaShelf-${GITHUB_REF_NAME}.apk"
          "MangaShelf-${GITHUB_REF_NAME}.sha256"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MangaShelf-${{ github.ref_name }}
          path: |
            MangaShelf-${{ github.ref_name }}.apk
            MangaShelf-${{ github.ref_name }}.sha256
          if-no-files-found: error
