name: 缺陷报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 安全漏洞请使用私有漏洞报告，不要在这里公开。
  - type: input
    id: version
    attributes:
      label: MangaShelf 版本
      placeholder: 例如 v1.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与 Android 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用不含私人漫画或个人信息的示例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
