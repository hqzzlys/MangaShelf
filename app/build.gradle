plugins { id 'com.android.application' }

def releaseStoreFile = System.getenv('MANGASHELF_KEYSTORE_PATH')

android {
    namespace = 'com.localmanga.shelf'
    compileSdk = 37
    defaultConfig {
        applicationId = 'com.localmanga.shelf'
        minSdk = 26
        targetSdk = 37
        versionCode = 14
        versionName = '1.4.0'
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile = file(releaseStoreFile)
                storePassword = System.getenv('MANGASHELF_STORE_PASSWORD')
                keyAlias = System.getenv('MANGASHELF_KEY_ALIAS')
                keyPassword = System.getenv('MANGASHELF_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile) signingConfig = signingConfigs.release
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
